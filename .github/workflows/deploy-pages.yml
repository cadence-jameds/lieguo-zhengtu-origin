name: Deploy approved release to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/release' && github.repository == 'cadence-jameds/lieguo-zhengtu-origin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require recorded release acceptance
        run: node scripts/check-release-approval.mjs

      - name: Install dependencies
        run: npm ci

      - run: npm run typecheck
      - name: Full regression in a disposable copy
        run: node scripts/verify-in-isolation.mjs full
      - run: npm run build
      - name: Check project Pages paths
        run: node scripts/check-pages-build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/release' && github.repository == 'cadence-jameds/lieguo-zhengtu-origin'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
