name: Validate main and manually deploy approved GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact reviewed main commit SHA to publish'
        required: true
        type: string
      confirmation:
        description: 'Type PUBLISH_B10 only after explicit production release approval'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'cadence-jameds/lieguo-zhengtu-origin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate explicit release request
        if: github.event_name == 'workflow_dispatch'
        env:
          B10_APPROVED_SHA: ${{ inputs.release_sha }}
          B10_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$B10_APPROVED_SHA" = "$GITHUB_SHA"
          test "$B10_RELEASE_CONFIRMATION" = 'PUBLISH_B10'

      # Main pushes validate and upload artifacts. Publication requires a separate
      # owner-initiated workflow_dispatch for this exact reviewed main SHA.
      # Failed typecheck/regression/build prevents artifact upload and deployment.
      - name: Install dependencies
        run: npm ci

      - name: Prepare deterministic release metadata
        run: npm run release:prepare
      - run: npm run typecheck
      - name: Full regression in a disposable copy
        run: node scripts/verify-in-isolation.mjs full
      - run: npm run build
      - name: Check project Pages paths
        run: node scripts/check-pages-build.mjs
      - name: Verify release artifacts
        run: node scripts/check-release-build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'cadence-jameds' && github.ref == 'refs/heads/main' && github.repository == 'cadence-jameds/lieguo-zhengtu-origin' && inputs.release_sha == github.sha && inputs.confirmation == 'PUBLISH_B10'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
